<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Baking Carousel · by Alexandra</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;600;700&display=swap');

  :root {
    --blush: #fce8ee;
    --blush-deep: #f8d0dc;
    --blush-card: #fff6f8;
    --cream: #fffbfc;
    --burgundy: #6b1a2e;
    --plum: #8b2945;
    --rose: #c96080;
    --rose-light: #e8a0b4;
    --rose-btn: #c05070;
    --pink-accent: #f0a0b8;
    --pink-soft: #fde0ea;
    --text-dark: #3a1020;
    --text-mid: #7a3050;
    --text-light: #b07090;
    --border: #f0c8d8;
    --shadow: rgba(150,60,90,0.10);
    --shadow-card: rgba(150,60,90,0.13);
    --green: #7db87a;
    --green-light: #e8f5e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--blush);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--cream);
    border-bottom: 1.5px solid var(--border);
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px var(--shadow);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 72px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .logo-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--burgundy);
    line-height: 1;
    letter-spacing: -0.3px;
  }
  .logo-title span { color: var(--rose); }
  .logo-sub {
    font-size: 10px;
    color: var(--rose-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 300;
  }
  .search-bar {
    flex: 1;
    max-width: 400px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    background: var(--blush-card);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    outline: none;
    transition: all 0.2s;
  }
  .search-bar input:focus { border-color: var(--rose); background: white; box-shadow: 0 0 0 3px rgba(192,80,112,0.10); }
  .search-bar input::placeholder { color: var(--rose-light); }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--rose-light);
    font-size: 15px;
  }
  .header-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .nav-btn {
    padding: 8px 16px;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--plum);
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-btn:hover { background: var(--pink-soft); border-color: var(--rose-light); }
  .nav-btn.active { background: var(--pink-soft); border-color: var(--rose); color: var(--burgundy); }
  .btn-new {
    padding: 9px 20px;
    border-radius: 50px;
    border: none;
    background: var(--rose-btn);
    color: white;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .btn-new:hover { background: var(--burgundy); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(107,26,46,0.25); }

  /* ── FILTER BAR ── */
  .filter-bar {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .filter-label { font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-right: 4px; }
  .filter-chip {
    padding: 6px 16px;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: var(--cream);
    color: var(--text-mid);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }
  .filter-chip:hover { background: var(--pink-soft); border-color: var(--rose-light); }
  .filter-chip.active { background: var(--rose-btn); border-color: var(--rose-btn); color: white; }

  /* ── SORT ROW ── */
  .sort-row {
    max-width: 1200px;
    margin: 14px auto 0;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .recipe-count { font-size: 13px; color: var(--text-light); }
  .sort-row select {
    padding: 6px 12px;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    background: var(--cream);
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    color: var(--text-mid);
    cursor: pointer;
    outline: none;
  }

  /* ── RECIPE GRID ── */
  .recipe-grid {
    max-width: 1200px;
    margin: 24px auto 60px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 24px;
  }

  /* ── RECIPE CARD ── */
  .recipe-card {
    background: var(--cream);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 18px var(--shadow-card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }
  .recipe-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(150,60,90,0.18); }
  .card-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--blush-deep), var(--pink-soft));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    position: relative;
  }
  .card-image img { width: 100%; height: 100%; object-fit: cover; }
  .card-image-placeholder { width: 100%; height: 190px; background: linear-gradient(135deg, var(--blush-deep), var(--pink-soft)); display: flex; align-items: center; justify-content: center; font-size: 52px; }
  .heart-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: all 0.2s;
    z-index: 2;
  }
  .heart-btn:hover { transform: scale(1.15); }
  .heart-btn.fav { background: var(--rose-btn); }
  .card-body { padding: 16px 18px 20px; }
  .card-category {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    color: var(--rose);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--burgundy);
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.55;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text-light);
  }
  .meta-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--pink-soft);
    padding: 3px 10px;
    border-radius: 50px;
    font-weight: 600;
    color: var(--rose);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
  }
  .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--burgundy); margin-bottom: 10px; }
  .empty-state p { color: var(--text-light); font-size: 15px; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60,10,25,0.45);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.hidden { display: none; }

  /* ── RECIPE DETAIL ── */
  .recipe-detail {
    background: var(--cream);
    border-radius: 28px;
    width: 100%;
    max-width: 820px;
    margin: auto;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(60,10,25,0.25);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .detail-hero {
    padding: 36px 40px 28px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }
  .detail-hero-text { flex: 1; }
  .detail-category {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--rose);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .detail-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--burgundy);
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .detail-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .detail-meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--pink-soft);
    padding: 5px 14px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    color: var(--plum);
  }
  .detail-desc {
    font-size: 15px;
    color: var(--text-mid);
    line-height: 1.65;
    font-style: italic;
  }
  .detail-image-wrap {
    flex-shrink: 0;
    width: 220px;
    height: 190px;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid var(--border);
    background: linear-gradient(135deg, var(--blush-deep), var(--pink-soft));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }
  .detail-image-wrap img { width: 100%; height: 100%; object-fit: cover; }

  .detail-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn-action {
    padding: 8px 20px;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--plum);
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-action:hover { background: var(--pink-soft); }
  .btn-action.danger { color: #c0392b; border-color: #f0c0c0; }
  .btn-action.danger:hover { background: #fff0f0; }
  .btn-action.primary { background: var(--rose-btn); color: white; border-color: var(--rose-btn); }
  .btn-action.primary:hover { background: var(--burgundy); }

  .detail-body { padding: 32px 40px; }

  .section-heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--rose);
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .ingredients-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 32px;
  }
  .ingredient-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    color: var(--text-dark);
    transition: background 0.15s;
  }
  .ingredient-item:hover { background: var(--pink-soft); }
  .ingredient-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rose); flex-shrink: 0; }
  .ingredient-qty { font-weight: 700; color: var(--plum); min-width: 28px; }

  .steps-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .step-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 18px;
    background: var(--blush-card);
    border-radius: 14px;
    border: 1px solid var(--border);
    transition: background 0.15s;
  }
  .step-item:hover { background: var(--pink-soft); }
  .step-num {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--rose-btn);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .step-text { font-size: 14px; color: var(--text-dark); line-height: 1.6; padding-top: 4px; }

  .notes-box {
    background: var(--pink-soft);
    border: 1.5px dashed var(--rose-light);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .notes-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--burgundy);
    margin-bottom: 10px;
    font-style: italic;
  }
  .notes-text { font-size: 13px; color: var(--text-mid); line-height: 1.65; font-style: italic; }
  .notes-empty { color: var(--rose-light); font-size: 13px; font-style: italic; }

  .source-link { font-size: 13px; color: var(--rose); text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .source-link:hover { color: var(--burgundy); text-decoration: underline; }

  .detail-close {
    position: absolute;
    top: 18px;
    right: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--pink-soft);
    color: var(--plum);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .detail-close:hover { background: var(--rose-btn); color: white; }

  /* ── FORM MODAL ── */
  .form-modal {
    background: var(--cream);
    border-radius: 28px;
    width: 100%;
    max-width: 680px;
    margin: auto;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(60,10,25,0.25);
    animation: slideUp 0.3s ease;
  }
  .form-header {
    padding: 28px 36px 20px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .form-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--burgundy);
  }
  .form-body { padding: 28px 36px; max-height: 72vh; overflow-y: auto; }
  .form-body::-webkit-scrollbar { width: 5px; }
  .form-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-mid);
    margin-bottom: 7px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    padding: 11px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--blush-card);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    outline: none;
    transition: all 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: var(--rose);
    background: white;
    box-shadow: 0 0 0 3px rgba(192,80,112,0.10);
  }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.55; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .dynamic-list { display: flex; flex-direction: column; gap: 8px; }
  .dynamic-item { display: flex; gap: 8px; align-items: center; }
  .dynamic-item input { flex: 1; }
  .dynamic-item .qty-input { width: 70px; flex: none; }
  .dynamic-item .unit-input { width: 80px; flex: none; }
  .btn-remove {
    width: 30px;
    height: 30px;
    border: none;
    background: var(--blush-deep);
    color: var(--rose);
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .btn-remove:hover { background: #ffcdd2; color: #c0392b; }
  .btn-add-row {
    padding: 8px 16px;
    border: 1.5px dashed var(--rose-light);
    border-radius: 10px;
    background: transparent;
    color: var(--rose);
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }
  .btn-add-row:hover { background: var(--pink-soft); border-color: var(--rose); }

  .form-footer {
    padding: 20px 36px 28px;
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    border-top: 1.5px solid var(--border);
    background: var(--blush-card);
  }
  .btn-cancel {
    padding: 10px 24px;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    background: transparent;
    color: var(--text-mid);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { background: var(--pink-soft); }
  .btn-save {
    padding: 10px 28px;
    border: none;
    border-radius: 50px;
    background: var(--rose-btn);
    color: white;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-save:hover { background: var(--burgundy); box-shadow: 0 4px 14px rgba(107,26,46,0.25); }

  /* ── CONFIRM DIALOG ── */
  .confirm-dialog {
    background: var(--cream);
    border-radius: 20px;
    padding: 32px;
    max-width: 360px;
    width: 100%;
    margin: auto;
    text-align: center;
    box-shadow: 0 20px 60px rgba(60,10,25,0.22);
    animation: slideUp 0.25s ease;
  }
  .confirm-dialog .confirm-icon { font-size: 40px; margin-bottom: 14px; }
  .confirm-dialog h3 { font-family: 'Playfair Display', serif; color: var(--burgundy); font-size: 20px; margin-bottom: 10px; }
  .confirm-dialog p { font-size: 14px; color: var(--text-mid); margin-bottom: 22px; line-height: 1.55; }
  .confirm-btns { display: flex; gap: 12px; justify-content: center; }
  .btn-confirm-delete { padding: 10px 22px; border: none; border-radius: 50px; background: #c0392b; color: white; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-confirm-cancel { padding: 10px 22px; border: 1.5px solid var(--border); border-radius: 50px; background: transparent; color: var(--text-mid); font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ── EXPORT MODAL ── */
  .export-modal {
    background: var(--cream);
    border-radius: 20px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    margin: auto;
    box-shadow: 0 20px 60px rgba(60,10,25,0.22);
    animation: slideUp 0.25s ease;
  }
  .export-modal h3 { font-family: 'Playfair Display', serif; color: var(--burgundy); font-size: 22px; margin-bottom: 18px; }
  .export-btn-row { display: flex; flex-direction: column; gap: 10px; }
  .export-opt {
    padding: 12px 18px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--blush-card);
    color: var(--plum);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .export-opt:hover { background: var(--pink-soft); border-color: var(--rose-light); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--burgundy);
    color: white;
    padding: 14px 22px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(60,10,25,0.3);
    z-index: 999;
    animation: fadeInUp 0.3s ease;
    max-width: 300px;
  }
  .toast.hidden { display: none; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ── IMAGE UPLOAD ── */
  .image-upload-area {
    border: 2px dashed var(--rose-light);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    background: var(--blush-card);
    transition: all 0.2s;
  }
  .image-upload-area:hover { background: var(--pink-soft); border-color: var(--rose); }
  .image-upload-area .upload-icon { font-size: 30px; margin-bottom: 8px; }
  .image-upload-area p { font-size: 13px; color: var(--text-light); }
  .image-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; margin-top: 10px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    header { padding: 0 16px; }
    .header-inner { height: auto; padding: 12px 0; flex-wrap: wrap; gap: 12px; }
    .search-bar { max-width: 100%; order: 3; width: 100%; }
    .header-nav { margin-left: 0; }
    .recipe-grid { grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 16px; }
    .detail-hero { flex-direction: column-reverse; }
    .detail-image-wrap { width: 100%; height: 200px; }
    .detail-body { padding: 24px 20px; }
    .detail-hero { padding: 24px 20px; }
    .ingredients-grid { grid-template-columns: 1fr; }
    .form-body { padding: 20px; max-height: 65vh; }
    .form-header { padding: 20px; }
    .form-footer { padding: 16px 20px; }
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
    .filter-bar { padding: 0 16px; }
    .sort-row { padding: 0 16px; }
  }
  @media (max-width: 480px) {
    .recipe-grid { grid-template-columns: 1fr; }
    .nav-btn { padding: 6px 12px; font-size: 12px; }
    .btn-new { padding: 8px 14px; font-size: 12px; }
  }

  .hidden { display: none !important; }
  .relative { position: relative; }

  .tags-input-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--blush-card); min-height: 44px; cursor: text; }
  .tag-chip { padding: 3px 10px; background: var(--pink-soft); border-radius: 50px; font-size: 12px; color: var(--plum); font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .tag-chip span { cursor: pointer; color: var(--rose); }
  .tags-input-wrap input { border: none; background: transparent; outline: none; font-family: 'Lato', sans-serif; font-size: 14px; color: var(--text-dark); min-width: 80px; flex: 1; }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="header-inner">
    <div class="logo" onclick="showHome()">
      <div class="logo-title">The Baking <span>Carousel</span></div>
      <div class="logo-sub">by Alexandra</div>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search recipes or ingredients…" oninput="handleSearch()">
    </div>
    <div class="header-nav">
      <button class="nav-btn active" id="navHome" onclick="filterView('all')">Home</button>
      <button class="nav-btn" id="navFav" onclick="filterView('favorites')">♡ Favorites</button>
      <button class="nav-btn" onclick="openExport()">⚙ Export</button>
      <button class="btn-new" onclick="openNewRecipe()">+ New Recipe</button>
    </div>
  </div>
</header>

<!-- ── FILTER BAR ── -->
<div class="filter-bar" id="filterBar">
  <span class="filter-label">Category</span>
  <button class="filter-chip active" onclick="setCategory('all', this)">All</button>
  <button class="filter-chip" onclick="setCategory('Cakes', this)">🎂 Cakes</button>
  <button class="filter-chip" onclick="setCategory('Cupcakes', this)">🧁 Cupcakes</button>
  <button class="filter-chip" onclick="setCategory('Cookies', this)">🍪 Cookies</button>
  <button class="filter-chip" onclick="setCategory('Bread', this)">🍞 Bread</button>
  <button class="filter-chip" onclick="setCategory('Breakfast', this)">🍳 Breakfast</button>
  <button class="filter-chip" onclick="setCategory('Desserts', this)">🍮 Desserts</button>
  <button class="filter-chip" onclick="setCategory('Main dishes', this)">🍽 Mains</button>
  <button class="filter-chip" onclick="setCategory('Pasta', this)">🍝 Pasta</button>
  <button class="filter-chip" onclick="setCategory('Salads', this)">🥗 Salads</button>
  <button class="filter-chip" onclick="setCategory('Drinks', this)">🥤 Drinks</button>
  <button class="filter-chip" onclick="setCategory('Other', this)">✨ Other</button>
</div>

<!-- ── SORT ROW ── -->
<div class="sort-row">
  <span class="recipe-count" id="recipeCount"></span>
  <select id="sortSelect" onchange="renderGrid()">
    <option value="recent">Recently added</option>
    <option value="alpha">Alphabetical</option>
    <option value="time">Shortest prep time</option>
  </select>
</div>

<!-- ── RECIPE GRID ── -->
<div class="recipe-grid" id="recipeGrid"></div>

<!-- ── RECIPE DETAIL MODAL ── -->
<div class="modal-overlay hidden" id="detailOverlay" onclick="closeDetailOnBg(event)">
  <div class="recipe-detail relative" id="recipeDetail">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-hero" id="detailHero"></div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- ── FORM MODAL ── -->
<div class="modal-overlay hidden" id="formOverlay">
  <div class="form-modal">
    <div class="form-header">
      <div class="form-title" id="formTitle">New Recipe</div>
      <button class="detail-close" onclick="closeForm()">✕</button>
    </div>
    <div class="form-body">
      <input type="hidden" id="editingId">
      <div class="form-group">
        <label>Recipe Name *</label>
        <input type="text" id="fName" placeholder="e.g. Chocolate Lava Cake">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="fDesc" rows="2" placeholder="A short, appetizing description…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category *</label>
          <select id="fCategory">
            <option value="">Select category</option>
            <option>Cakes</option><option>Cupcakes</option><option>Cookies</option>
            <option>Bread</option><option>Breakfast</option><option>Desserts</option>
            <option>Main dishes</option><option>Pasta</option><option>Soups</option>
            <option>Salads</option><option>Drinks</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Difficulty</label>
          <select id="fDiff">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>
      </div>
      <div class="form-row-3">
        <div class="form-group">
          <label>Prep time (min)</label>
          <input type="number" id="fPrep" placeholder="30">
        </div>
        <div class="form-group">
          <label>Cook time (min)</label>
          <input type="number" id="fCook" placeholder="45">
        </div>
        <div class="form-group">
          <label>Servings</label>
          <input type="number" id="fServ" placeholder="8">
        </div>
      </div>
      <div class="form-group">
        <label>Recipe Photo</label>
        <div class="image-upload-area" onclick="document.getElementById('fImageFile').click()">
          <div class="upload-icon">📷</div>
          <p>Click to upload a photo</p>
          <img id="fImagePreview" class="image-preview hidden" src="" alt="preview">
        </div>
        <input type="file" id="fImageFile" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        <input type="hidden" id="fImageData">
      </div>
      <div class="form-group">
        <label>Ingredients</label>
        <div class="dynamic-list" id="ingredientsList"></div>
        <button class="btn-add-row" onclick="addIngredient()">+ Add ingredient</button>
      </div>
      <div class="form-group">
        <label>Steps</label>
        <div class="dynamic-list" id="stepsList"></div>
        <button class="btn-add-row" onclick="addStep()">+ Add step</button>
      </div>
      <div class="form-group">
        <label>Tags (press Enter to add)</label>
        <div class="tags-input-wrap" id="tagsWrap" onclick="document.getElementById('tagInput').focus()">
          <input type="text" id="tagInput" placeholder="e.g. chocolate, summer…" onkeydown="handleTagInput(event)">
        </div>
        <input type="hidden" id="fTags">
      </div>
      <div class="form-group">
        <label>Source / URL</label>
        <input type="text" id="fSource" placeholder="https://…">
      </div>
      <div class="form-group">
        <label>Alexandra's Notes</label>
        <textarea id="fNotes" rows="3" placeholder="Personal tips, substitutions, what to do differently next time…"></textarea>
      </div>
    </div>
    <div class="form-footer">
      <button class="btn-cancel" onclick="closeForm()">Cancel</button>
      <button class="btn-save" onclick="saveRecipe()">Save Recipe 🎂</button>
    </div>
  </div>
</div>

<!-- ── CONFIRM DELETE ── -->
<div class="modal-overlay hidden" id="confirmOverlay">
  <div class="confirm-dialog">
    <div class="confirm-icon">🗑️</div>
    <h3>Delete Recipe?</h3>
    <p>Are you sure you want to delete this recipe? This action cannot be undone.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="closeConfirm()">Keep it</button>
      <button class="btn-confirm-delete" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- ── EXPORT MODAL ── -->
<div class="modal-overlay hidden" id="exportOverlay" onclick="closeExportOnBg(event)">
  <div class="export-modal">
    <h3>📚 My Cookbook</h3>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:18px;">Export, import or backup your recipes.</p>
    <div class="export-btn-row">
      <button class="export-opt" onclick="exportJSON()">⬇️ Export as JSON (backup)</button>
      <button class="export-opt" onclick="document.getElementById('importFile').click()">⬆️ Import from JSON</button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
      <button class="export-opt" onclick="closeExport()">✕ Close</button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast hidden" id="toast"></div>

<script>
// ── STATE ──
let currentTags = [];
let currentFilter = 'all';
let currentCategory = 'all';
let currentView = 'all';
let editingRecipeId = null;
let deleteTargetId = null;

const STORAGE_KEY = 'baking_carousel_recipes';

function loadRecipes() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}

function saveRecipes(recipes) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
}

// ── SEED DATA ──
function seedIfEmpty() {
  let recipes = loadRecipes();
  if (recipes.length === 0) {
    recipes = [{
      id: Date.now().toString(),
      name: "Oreo Strawberry Cupcakes",
      description: "Irresistibly soft cupcakes with a golden Oreo base, topped with a dreamy cream cheese and chocolate frosting. A perfect treat for any occasion!",
      category: "Cupcakes",
      difficulty: "Easy",
      prepTime: 30,
      cookTime: 10,
      servings: 10,
      imageData: "",
      imageEmoji: "🧁",
      ingredients: [
        { qty: "6", unit: "", name: "eggs" },
        { qty: "1", unit: "kg", name: "flour" },
        { qty: "1", unit: "packet", name: "Oreo Golden" },
        { qty: "200", unit: "g", name: "cream cheese" },
        { qty: "100", unit: "g", name: "chocolate" },
        { qty: "10", unit: "", name: "cupcake cases" },
        { qty: "", unit: "", name: "milk" },
        { qty: "", unit: "", name: "butter" },
        { qty: "", unit: "", name: "salt" },
        { qty: "", unit: "", name: "sugar" }
      ],
      steps: [
        "Prepare the cupcake cases and preheat the oven to 130°C.",
        "Beat the eggs together with the sugar and flour until fluffy.",
        "Add the crushed Oreo cookies and mix gently.",
        "Bake at 130°C for 10 minutes until golden.",
        "Prepare the cream by mixing the cream cheese with sugar, flour and melted chocolate.",
        "Put the cream into a piping bag and decorate the cupcakes generously.",
        "Decorate with chocolate pieces, sprinkles or other toppings."
      ],
      tags: ["cupcakes", "oreo", "strawberry", "chocolate", "cream cheese"],
      source: "",
      notes: "Use less sugar next time — they were a little sweet! Also try adding fresh strawberry pieces on top. 🍓",
      favorite: true,
      createdAt: Date.now()
    }];
    saveRecipes(recipes);
  }
}

// ── RENDER ──
function getFilteredRecipes() {
  let recipes = loadRecipes();
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (currentView === 'favorites') recipes = recipes.filter(r => r.favorite);
  if (currentCategory !== 'all') recipes = recipes.filter(r => r.category === currentCategory);
  if (q) {
    recipes = recipes.filter(r => {
      const ingText = r.ingredients.map(i => i.name + ' ' + i.qty + ' ' + i.unit).join(' ').toLowerCase();
      const tagText = (r.tags || []).join(' ').toLowerCase();
      return r.name.toLowerCase().includes(q) ||
             (r.description||'').toLowerCase().includes(q) ||
             ingText.includes(q) ||
             tagText.includes(q) ||
             r.category.toLowerCase().includes(q);
    });
  }
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'alpha') recipes.sort((a,b) => a.name.localeCompare(b.name));
  else if (sort === 'time') recipes.sort((a,b) => ((a.prepTime||0)+(a.cookTime||0)) - ((b.prepTime||0)+(b.cookTime||0)));
  else recipes.sort((a,b) => b.createdAt - a.createdAt);
  return recipes;
}

function renderGrid() {
  const grid = document.getElementById('recipeGrid');
  const recipes = getFilteredRecipes();
  document.getElementById('recipeCount').textContent = `${recipes.length} recipe${recipes.length !== 1 ? 's' : ''}`;
  if (recipes.length === 0) {
    const q = document.getElementById('searchInput').value;
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${q ? '🔍' : '🎂'}</div>
      <h3>${q ? 'No recipes found.' : currentView === 'favorites' ? 'No favorites yet.' : 'Your cookbook is empty!'}</h3>
      <p>${q ? 'Try another ingredient or recipe name.' : currentView === 'favorites' ? 'Click the ♡ on a recipe to save it here.' : 'Click "+ New Recipe" to add your first recipe!'}</p>
    </div>`;
    return;
  }
  grid.innerHTML = recipes.map(r => {
    const totalTime = (r.prepTime||0) + (r.cookTime||0);
    return `<div class="recipe-card" onclick="openDetail('${r.id}')">
      <div class="relative">
        ${r.imageData
          ? `<img src="${r.imageData}" alt="${r.name}" style="width:100%;height:190px;object-fit:cover;">`
          : `<div class="card-image-placeholder">${r.imageEmoji || '🍽️'}</div>`}
        <button class="heart-btn ${r.favorite ? 'fav' : ''}" onclick="toggleFav(event,'${r.id}')">
          ${r.favorite ? '❤️' : '🤍'}
        </button>
      </div>
      <div class="card-body">
        <div class="card-category">${r.category}</div>
        <div class="card-title">${r.name}</div>
        <div class="card-desc">${r.description || 'A delicious recipe waiting to be explored.'}</div>
        <div class="card-meta">
          ${totalTime ? `<span class="meta-pill">⏱ ${totalTime} min</span>` : ''}
          <span class="meta-pill">${diffIcon(r.difficulty)} ${r.difficulty||'Easy'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function diffIcon(d) {
  if (d === 'Easy') return '🟢';
  if (d === 'Medium') return '🟡';
  if (d === 'Hard') return '🔴';
  return '🟢';
}

// ── FILTERS ──
function filterView(v) {
  currentView = v;
  currentCategory = 'all';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.filter-chip').classList.add('active');
  document.getElementById('navHome').classList.toggle('active', v === 'all');
  document.getElementById('navFav').classList.toggle('active', v === 'favorites');
  renderGrid();
}

function setCategory(cat, el) {
  currentCategory = cat;
  currentView = 'all';
  document.getElementById('navHome').classList.add('active');
  document.getElementById('navFav').classList.remove('active');
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function handleSearch() { renderGrid(); }
function showHome() { filterView('all'); }

// ── TOGGLE FAVORITE ──
function toggleFav(e, id) {
  e.stopPropagation();
  const recipes = loadRecipes();
  const r = recipes.find(x => x.id === id);
  if (r) { r.favorite = !r.favorite; saveRecipes(recipes); }
  renderGrid();
  showToast(r.favorite ? '❤️ Added to favorites!' : '🤍 Removed from favorites');
}

// ── DETAIL VIEW ──
function openDetail(id) {
  const recipes = loadRecipes();
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const totalTime = (r.prepTime||0) + (r.cookTime||0);
  document.getElementById('detailHero').innerHTML = `
    <div class="detail-hero-text">
      <div class="detail-category">${r.category}</div>
      <div class="detail-title">${r.name}</div>
      <div class="detail-meta-row">
        ${r.prepTime ? `<span class="detail-meta-item">🥄 Prep: ${r.prepTime} min</span>` : ''}
        ${r.cookTime ? `<span class="detail-meta-item">🔥 Cook: ${r.cookTime} min</span>` : ''}
        ${totalTime ? `<span class="detail-meta-item">⏱ Total: ${totalTime} min</span>` : ''}
        <span class="detail-meta-item">${diffIcon(r.difficulty)} ${r.difficulty||'Easy'}</span>
        ${r.servings ? `<span class="detail-meta-item">🍽 Serves ${r.servings}</span>` : ''}
      </div>
      ${r.description ? `<div class="detail-desc">${r.description}</div>` : ''}
      <div class="detail-actions">
        <button class="btn-action primary" onclick="toggleFavDetail('${r.id}')" id="favDetailBtn">${r.favorite ? '❤️ Favorited' : '♡ Favorite'}</button>
        <button class="btn-action" onclick="editRecipe('${r.id}')">✏️ Edit</button>
        <button class="btn-action danger" onclick="confirmDelete('${r.id}')">🗑 Delete</button>
      </div>
    </div>
    <div class="detail-image-wrap">
      ${r.imageData ? `<img src="${r.imageData}" alt="${r.name}">` : `<span style="font-size:56px">${r.imageEmoji||'🍽️'}</span>`}
    </div>`;

  // ingredients
  const ingCols = r.ingredients.reduce((acc, ing, i) => {
    const txt = `<div class="ingredient-item"><span class="ingredient-dot"></span><span class="ingredient-qty">${ing.qty||''}</span><span style="color:var(--text-light);font-size:12px;margin-right:4px">${ing.unit||''}</span><span>${ing.name}</span></div>`;
    acc[i % 2 === 0 ? 'left' : 'right'].push(txt);
    return acc;
  }, {left:[], right:[]});

  // steps
  const stepsHTML = r.steps.map((s,i) =>
    `<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`
  ).join('');

  // tags
  const tagsHTML = r.tags && r.tags.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px">${r.tags.map(t => `<span class="tag-chip">#${t}</span>`).join('')}</div>`
    : '';

  document.getElementById('detailBody').innerHTML = `
    <div class="section-heading">Ingredients</div>
    <div class="ingredients-grid">
      <div>${ingCols.left.join('')}</div>
      <div>${ingCols.right.join('')}</div>
    </div>
    <div class="section-heading">Steps</div>
    <div class="steps-list">${stepsHTML}</div>
    ${tagsHTML}
    <div class="section-heading">Alexandra's Notes</div>
    <div class="notes-box">
      <div class="notes-title">✍️ Alexandra's Notes</div>
      ${r.notes ? `<div class="notes-text">${r.notes}</div>` : `<div class="notes-empty">No notes yet — add your thoughts after trying this recipe!</div>`}
    </div>
    ${r.source ? `<a href="${r.source}" target="_blank" rel="noopener" class="source-link">🔗 ${r.source}</a>` : ''}
  `;

  document.getElementById('detailOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function toggleFavDetail(id) {
  const recipes = loadRecipes();
  const r = recipes.find(x => x.id === id);
  if (r) { r.favorite = !r.favorite; saveRecipes(recipes); }
  const btn = document.getElementById('favDetailBtn');
  if (btn) btn.textContent = r.favorite ? '❤️ Favorited' : '♡ Favorite';
  renderGrid();
  showToast(r.favorite ? '❤️ Added to favorites!' : '🤍 Removed from favorites');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}
function closeDetailOnBg(e) {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
}

// ── NEW / EDIT FORM ──
function openNewRecipe() {
  editingRecipeId = null;
  document.getElementById('formTitle').textContent = 'New Recipe ✨';
  document.getElementById('editingId').value = '';
  clearForm();
  addIngredient(); addIngredient(); addIngredient();
  addStep(); addStep();
  document.getElementById('formOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function editRecipe(id) {
  const recipes = loadRecipes();
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  closeDetail();
  editingRecipeId = id;
  document.getElementById('formTitle').textContent = 'Edit Recipe ✏️';
  document.getElementById('editingId').value = id;
  document.getElementById('fName').value = r.name || '';
  document.getElementById('fDesc').value = r.description || '';
  document.getElementById('fCategory').value = r.category || '';
  document.getElementById('fDiff').value = r.difficulty || 'Easy';
  document.getElementById('fPrep').value = r.prepTime || '';
  document.getElementById('fCook').value = r.cookTime || '';
  document.getElementById('fServ').value = r.servings || '';
  document.getElementById('fSource').value = r.source || '';
  document.getElementById('fNotes').value = r.notes || '';
  document.getElementById('fImageData').value = r.imageData || '';
  if (r.imageData) {
    document.getElementById('fImagePreview').src = r.imageData;
    document.getElementById('fImagePreview').classList.remove('hidden');
  }
  // ingredients
  document.getElementById('ingredientsList').innerHTML = '';
  (r.ingredients || []).forEach(ing => addIngredient(ing.qty, ing.unit, ing.name));
  if (!r.ingredients || r.ingredients.length === 0) addIngredient();
  // steps
  document.getElementById('stepsList').innerHTML = '';
  (r.steps || []).forEach(s => addStep(s));
  if (!r.steps || r.steps.length === 0) addStep();
  // tags
  currentTags = [...(r.tags || [])];
  renderTags();
  document.getElementById('formOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function clearForm() {
  ['fName','fDesc','fSource','fNotes','fPrep','fCook','fServ'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCategory').value = '';
  document.getElementById('fDiff').value = 'Easy';
  document.getElementById('fImageData').value = '';
  document.getElementById('fImagePreview').src = '';
  document.getElementById('fImagePreview').classList.add('hidden');
  document.getElementById('ingredientsList').innerHTML = '';
  document.getElementById('stepsList').innerHTML = '';
  currentTags = [];
  renderTags();
}

function closeForm() {
  document.getElementById('formOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}

function addIngredient(qty='', unit='', name='') {
  const list = document.getElementById('ingredientsList');
  const div = document.createElement('div');
  div.className = 'dynamic-item';
  div.innerHTML = `
    <input class="qty-input" type="text" placeholder="Qty" value="${qty}">
    <input class="unit-input" type="text" placeholder="Unit" value="${unit}">
    <input type="text" placeholder="Ingredient name" value="${name}">
    <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>`;
  list.appendChild(div);
}

function addStep(text='') {
  const list = document.getElementById('stepsList');
  const n = list.children.length + 1;
  const div = document.createElement('div');
  div.className = 'dynamic-item';
  div.innerHTML = `
    <div class="step-num" style="flex-shrink:0">${n}</div>
    <input type="text" placeholder="Describe step ${n}…" value="${text.replace(/"/g,'&quot;')}">
    <button class="btn-remove" onclick="removeStep(this)">✕</button>`;
  list.appendChild(div);
}

function removeStep(btn) {
  btn.parentElement.remove();
  // renumber
  document.querySelectorAll('#stepsList .step-num').forEach((el, i) => el.textContent = i+1);
}

// ── TAGS ──
function handleTagInput(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,/g,'');
    if (val && !currentTags.includes(val)) { currentTags.push(val); renderTags(); }
    e.target.value = '';
  }
}
function renderTags() {
  const wrap = document.getElementById('tagsWrap');
  const input = document.getElementById('tagInput');
  wrap.innerHTML = '';
  currentTags.forEach((t, i) => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.innerHTML = `${t} <span onclick="removeTag(${i})">✕</span>`;
    wrap.appendChild(chip);
  });
  wrap.appendChild(input);
}
function removeTag(i) { currentTags.splice(i,1); renderTags(); }

// ── IMAGE ──
function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('fImageData').value = ev.target.result;
    document.getElementById('fImagePreview').src = ev.target.result;
    document.getElementById('fImagePreview').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

// ── SAVE ──
function saveRecipe() {
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCategory').value;
  if (!name) { showToast('⚠️ Please enter a recipe name!'); return; }
  if (!category) { showToast('⚠️ Please select a category!'); return; }

  const ingredients = Array.from(document.querySelectorAll('#ingredientsList .dynamic-item')).map(row => {
    const inputs = row.querySelectorAll('input');
    return { qty: inputs[0].value.trim(), unit: inputs[1].value.trim(), name: inputs[2].value.trim() };
  }).filter(i => i.name);

  const steps = Array.from(document.querySelectorAll('#stepsList .dynamic-item input')).map(i => i.value.trim()).filter(Boolean);

  const tagInput = document.getElementById('tagInput').value.trim();
  if (tagInput) currentTags.push(tagInput);

  const recipe = {
    id: editingRecipeId || Date.now().toString(),
    name,
    description: document.getElementById('fDesc').value.trim(),
    category,
    difficulty: document.getElementById('fDiff').value,
    prepTime: parseInt(document.getElementById('fPrep').value) || 0,
    cookTime: parseInt(document.getElementById('fCook').value) || 0,
    servings: parseInt(document.getElementById('fServ').value) || 0,
    imageData: document.getElementById('fImageData').value,
    imageEmoji: getCategoryEmoji(category),
    ingredients,
    steps,
    tags: [...currentTags],
    source: document.getElementById('fSource').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
    favorite: false,
    createdAt: editingRecipeId ? (loadRecipes().find(r=>r.id===editingRecipeId)||{}).createdAt || Date.now() : Date.now()
  };

  let recipes = loadRecipes();
  if (editingRecipeId) {
    const idx = recipes.findIndex(r => r.id === editingRecipeId);
    if (idx > -1) { recipe.favorite = recipes[idx].favorite; recipes[idx] = recipe; }
    else recipes.push(recipe);
  } else {
    recipes.push(recipe);
  }
  saveRecipes(recipes);
  closeForm();
  renderGrid();
  showToast(editingRecipeId ? '✅ Recipe updated!' : '🎉 Recipe saved!');
}

function getCategoryEmoji(cat) {
  const map = { 'Cakes':'🎂','Cupcakes':'🧁','Cookies':'🍪','Bread':'🍞','Breakfast':'🍳','Desserts':'🍮','Main dishes':'🍽️','Pasta':'🍝','Soups':'🍲','Salads':'🥗','Drinks':'🥤','Other':'✨' };
  return map[cat] || '🍽️';
}

// ── DELETE ──
function confirmDelete(id) {
  deleteTargetId = id;
  document.getElementById('confirmOverlay').classList.remove('hidden');
  document.getElementById('confirmDeleteBtn').onclick = () => {
    let recipes = loadRecipes();
    recipes = recipes.filter(r => r.id !== deleteTargetId);
    saveRecipes(recipes);
    closeConfirm();
    closeDetail();
    renderGrid();
    showToast('🗑️ Recipe deleted');
  };
}
function closeConfirm() {
  document.getElementById('confirmOverlay').classList.add('hidden');
  deleteTargetId = null;
}

// ── EXPORT / IMPORT ──
function openExport() {
  document.getElementById('exportOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeExport() {
  document.getElementById('exportOverlay').classList.add('hidden');
  document.body.style.overflow = '';
}
function closeExportOnBg(e) {
  if (e.target === document.getElementById('exportOverlay')) closeExport();
}
function exportJSON() {
  const recipes = loadRecipes();
  const blob = new Blob([JSON.stringify(recipes, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'baking_carousel_backup.json';
  a.click();
  showToast('✅ Cookbook exported!');
  closeExport();
}
function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error('Invalid format');
      const existing = loadRecipes();
      const existingIds = new Set(existing.map(r => r.id));
      const merged = [...existing, ...imported.filter(r => !existingIds.has(r.id))];
      saveRecipes(merged);
      renderGrid();
      showToast(`✅ Imported ${imported.length} recipes!`);
      closeExport();
    } catch { showToast('⚠️ Invalid file format'); }
  };
  reader.readAsText(file);
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}

// ── INIT ──
seedIfEmpty();
renderGrid();
</script>
